name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-validate:
    name: Build & TypeScript Type Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install & Validate Backend
        run: |
          cd backend
          npm ci || npm install
          npm run build

      - name: Install & Validate Website (Next.js)
        run: |
          cd frontend/website
          npm ci || npm install
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.aarambhatravels.in

      - name: Install & Validate CRM (Vite)
        run: |
          cd frontend/crm
          npm ci || npm install
          npm run build
        env:
          VITE_API_URL: https://api.aarambhatravels.in
